# Base configuration shared by all services (no entrypoint, no command)
x-service-base: &service-base
  image: ghcr.io/ethiquema/ryu_ldn_nx:latest
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - .:/workspace
  working_dir: /workspace

# Build-specific base (adds entrypoint + command)
x-build-base: &build-base
  <<: *service-base
  entrypoint: ["/bin/bash"]
  command: ["/workspace/scripts/builder/entrypoint-build.sh"]

# Clean-specific base (adds entrypoint + command)
x-clean-base: &clean-base
  <<: *service-base
  entrypoint: ["/bin/bash"]
  command: ["/workspace/scripts/builder/entrypoint-clean.sh"]

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Build everything + package into output/ and ZIP (embedded atmosphere-libs)
  # Usage: docker compose run --rm build
  # Uses the pre-built libstratosphere.a from the Docker image.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    <<: *build-base

  # ──────────────────────────────────────────────────────────────────────────
  # Build with LOCAL atmosphere-libs (./sysmodule/Atmosphere-libs)
  # Usage: docker compose run --rm build-local
  # Mounts the local Atmosphere-libs checkout over /opt/ryu_ldn_nx,
  # shadowing the image's pre-built .a and exposing local source for patching.
  # ──────────────────────────────────────────────────────────────────────────
  build-local:
    <<: *build-base
    volumes:
      - .:/workspace
      - ./sysmodule/Atmosphere-libs:/opt/ryu_ldn_nx
    environment:
      - ATMOSPHERE_LIBS_PATH=/workspace/sysmodule/Atmosphere-libs

  # ──────────────────────────────────────────────────────────────────────────
  # Clean all build artifacts + output (embedded atmosphere-libs)
  # Usage: docker compose run --rm clean
  # ──────────────────────────────────────────────────────────────────────────
  clean:
    <<: *clean-base

  # ──────────────────────────────────────────────────────────────────────────
  # Clean with LOCAL atmosphere-libs (./sysmodule/Atmosphere-libs)
  # Usage: docker compose run --rm clean-local
  # Extended clean: also cleans local libstratosphere build artifacts.
  # ──────────────────────────────────────────────────────────────────────────
  clean-local:
    <<: *clean-base
    volumes:
      - .:/workspace
      - ./sysmodule/Atmosphere-libs:/opt/ryu_ldn_nx
    environment:
      - ATMOSPHERE_LIBS_PATH=/workspace/sysmodule/Atmosphere-libs

  # Run tests (host binary with g++)
  # NOTE: tests run on the host, not in the dev container — they use
  # g++ and don't need cross-compilation. This is kept as a fallback.
  test:
    <<: *service-base
    working_dir: /workspace/tests
    command: make clean test

  # GDB debugger for Switch (interactive)
  # Usage: docker compose run --rm debugger <SWITCH_IP> [PROCESS_ID]
  debugger:
    <<: *service-base
    network_mode: host
    stdin_open: true
    tty: true
    entrypoint: ["/workspace/scripts/debugger/debug.sh"]

  # Run clang-tidy on project source files (not Atmosphere-libs)
  # Usage: docker compose run --rm lint
  lint:
    <<: *service-base
    entrypoint: ["/bin/bash", "/workspace/scripts/lint.sh"]

  # Run CodeQL analysis (standalone CLI, no GitHub Actions needed)
  # Usage: docker compose run --rm codeql-analyze
  codeql-create:
    <<: *service-base
    entrypoint: ["/bin/bash", "/workspace/scripts/codeql-create.sh"]

  codeql-analyze:
    <<: *service-base
    entrypoint: ["/bin/bash", "/workspace/scripts/codeql-analyze.sh"]

  shell:
    <<: *service-base
    network_mode: host
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]