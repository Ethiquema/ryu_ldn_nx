name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: read

jobs:
  verify-branch:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Workflow dispatch — skipping branch check"
            exit 0
          fi
          git fetch origin main
          TAG_COMMIT="${{ github.sha }}"
          MAIN_TIP=$(git rev-parse origin/main)
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_TIP"; then
            echo "::error::Tag ${{ github.ref_name }} is not on the main branch. Releases can only be created from main."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on main ✓"

  # Shared test + build pipeline extracted into _build-base.yml.
  # Releases always run the build job (run-build=true) and use the
  # generic artifact names that the create-release job below expects.
  base:
    name: Test & Build (reusable)
    needs: verify-branch
    uses: ./.github/workflows/_build-base.yml
    with:
      run-build: true
      default-branch: 'main'
      artifact-name-zip: 'release-zip'
      artifact-name-debug: 'debug-symbols'
      # Release workflow always updates the coverage badge.
      badge-always: true
    permissions:
      contents: read
      packages: read

  create-release:
    name: Create Release
    needs: base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release ZIP
        uses: actions/download-artifact@v8
        with:
          name: release-zip
          path: .

      - name: Download debug symbols
        uses: actions/download-artifact@v8
        with:
          name: debug-symbols
          path: debug

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Rename ZIP with version
        run: mv ryu_ldn_nx-release.zip ryu_ldn_nx-${{ steps.version.outputs.version }}.zip

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          cat > CHANGELOG_RELEASE.md << 'HEADER'
          ## ryu_ldn_nx ${VERSION}

          Nintendo Switch LDN sysmodule for online local multiplayer with Ryujinx servers.

          ### Installation

          1. Extract the ZIP to the root of your SD card
          2. Reboot your Switch
          3. The sysmodule will start automatically
          4. Use Tesla Menu (L+Down+R3) to access the overlay

          ---

          ### Changelog
          HEADER

          if [ -n "$PREV_TAG" ]; then
            echo "" >> CHANGELOG_RELEASE.md
            echo "Changes since \`${PREV_TAG}\`:" >> CHANGELOG_RELEASE.md
            echo "" >> CHANGELOG_RELEASE.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" >> CHANGELOG_RELEASE.md
          else
            echo "- Initial release" >> CHANGELOG_RELEASE.md
          fi

          echo ""
          echo "=== Generated changelog ==="
          cat CHANGELOG_RELEASE.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ryu_ldn_nx ${{ steps.version.outputs.version }}
          body_path: CHANGELOG_RELEASE.md
          draft: false
          prerelease: false
          files: |
            ryu_ldn_nx-${{ steps.version.outputs.version }}.zip
            debug/ryu_ldn_nx.elf