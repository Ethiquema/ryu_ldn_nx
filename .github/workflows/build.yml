name: Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  # Verify every commit in a PR carries a DCO Signed-off-by line.
  # Runs first so a missing sign-off fails the workflow fast, before
  # any expensive test/build job spins up.
  dco-check:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on every commit in the PR
        run: |
          set -euo pipefail
          # Range of commits introduced by this PR (base..head).
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Checking DCO for commits ${BASE_SHA:0:7}..${HEAD_SHA:0:7}"

          MISSING=0
          MISMATCH=0
          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            body=$(git show -s --format='%B' "$sha")
            author=$(git show -s --format='%an <%ae>' "$sha")

            # 1. A Signed-off-by trailer must be present at all.
            if ! printf '%s' "$body" | grep -Eq '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit ${sha} is missing a Signed-off-by line"
              echo "----- ${sha:0:7} message -----"
              printf '%s\n' "$body"
              echo "------------------------------"
              MISSING=$((MISSING + 1))
              continue
            fi

            # 2. Per the Developer Certificate of Origin, the author's own
            #    sign-off must be present — a co-authored Signed-off-by from
            #    another contributor does not satisfy the requirement for the
            #    commit author. Compare the 'Name <email>' portion of every
            #    Signed-off-by trailer against '%an <%ae>'.
            #    `sed` strips the 'Signed-off-by: ' prefix and trailing
            #    whitespace; `grep -Fxq` requires an exact full-line match.
            if ! printf '%s\n' "$body" \
                 | grep -E '^Signed-off-by: ' \
                 | sed 's/^Signed-off-by: //; s/[[:space:]]*$//' \
                 | grep -Fxq "$author"; then
              echo "::error::Commit ${sha} Signed-off-by does not match author '${author}'"
              echo "----- ${sha:0:7} message -----"
              printf '%s\n' "$body"
              echo "------------------------------"
              MISMATCH=$((MISMATCH + 1))
            fi
          done

          TOTAL=$((MISSING + MISMATCH))
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::${TOTAL} commit(s) failed DCO check (${MISSING} missing, ${MISMATCH} mismatched). Rebase with --signoff (git commit -s / git rebase --signoff)."
            exit 1
          fi

          echo "All PR commits carry a Signed-off-by line matching the commit author ✓"

  # Static analysis (clang-tidy via scripts/lint.sh + docker compose lint).
  # Runs on push and PR so lint regressions fail early.
  lint:
    name: Static lint (clang-tidy)
    runs-on: ubuntu-latest
    needs: dco-check
    if: always() && (needs.dco-check.result == 'success' || needs.dco-check.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run lint service
        run: docker compose run --rm lint

  # Shared test + build pipeline extracted into _build-base.yml.
  # On PRs only the test job runs (run-build=false); on develop pushes
  # both test and build run, then the pre-release job consumes the
  # artifacts produced by the reusable build job.
  base:
    name: Test & Build (reusable)
    needs: [dco-check, lint]
    if: always() && (needs.dco-check.result == 'success' || needs.dco-check.result == 'skipped') && (needs.lint.result == 'success' || needs.lint.result == 'skipped')
    uses: ./.github/workflows/_build-base.yml
    with:
      # Build the sysmodule only on develop pushes (not on PRs).
      run-build: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      default-branch: 'develop'
      artifact-name-zip: ryu_ldn_nx-release-${{ github.sha }}
      artifact-name-debug: ryu_ldn_nx-debug-${{ github.sha }}
      # Build.yml updates the coverage badge only on push events.
      badge-always: false
    permissions:
      contents: read
      packages: read

  pre-release:
    name: Create Pre-Release
    runs-on: ubuntu-latest
    needs: base
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download release ZIP
        uses: actions/download-artifact@v8
        with:
          name: ryu_ldn_nx-release-${{ github.sha }}
          path: release

      - name: Download debug symbols
        uses: actions/download-artifact@v8
        with:
          name: ryu_ldn_nx-debug-${{ github.sha }}
          path: debug

      - name: Get short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Delete existing pre-release
        run: |
          gh release delete dev --yes || true
          git push origin :refs/tags/dev || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pre-Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: "Development Build (${{ steps.sha.outputs.short }})"
          prerelease: true
          body: |
            ## Development Build

            **Commit:** ${{ github.sha }}
            **Branch:** develop
            **Date:** ${{ github.event.head_commit.timestamp }}

            ---

            ### WARNING

            This is an automatic development build. **No guarantee of functionality.**

            These builds are automatically generated on each commit to the develop branch and may
            contain bugs, incomplete features, or regressions.

            **Use at your own risk.**

            ---

            ### Installation

            1. Download the ZIP below
            2. Extract to the root of your SD card
            3. Reboot your Switch
            4. Config file will be created automatically on first boot

            ### Files

            - `ryu_ldn_nx-release.zip` - Complete package (sysmodule + overlay + config)
            - `ryu_ldn_nx.elf` / `ryu_ldn_nx.nso` - Debug symbols
          files: |
            release/ryu_ldn_nx-release.zip
            debug/ryu_ldn_nx.elf